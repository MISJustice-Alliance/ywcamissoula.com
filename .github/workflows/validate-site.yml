name: Validate site content

on:
  push:
    paths: ["gitbook-export/**", "tools/**", ".github/workflows/validate-site.yml"]
  pull_request:
    paths: ["gitbook-export/**", "tools/**", ".github/workflows/validate-site.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/requirements.txt
      - run: python -m pytest -q tools/tests
      - run: python tools/validate_site.py gitbook-export
